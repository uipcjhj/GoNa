# Render 무료 웹서비스 배포 정의 (Blueprint). 비밀값은 여기에 적지 않고 Render 대시보드에서 입력합니다 (sync: false).
# 데이터는 Supabase(무료)에 저장됩니다 — Render 무료 서버의 로컬 파일은 재시작 시 사라집니다.
services:
  - type: web
    name: global-opportunity-radar
    runtime: node
    plan: free
    region: singapore            # 한국에서 가장 가까운 Render 리전 (Supabase는 서울 권장)
    branch: claude/charming-maxwell-n3yywy
    autoDeploy: true
    # 빌드와 실행의 메모리 제한을 분리: 빌드(타입 검사 포함)는 힙 약 640MB 이상 필요 → 1536MB 허용 (빌드 머신은 별도 자원),
    # 실행은 인스턴스 RAM 512MB 안에 들도록 힙 320MB로 제한 (측정: 기사 2천 건 부하에서 RSS 약 370MB)
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=1536 npm run build
    startCommand: NODE_OPTIONS=--max-old-space-size=320 npm start   # next start -H 0.0.0.0 -p $PORT (Render가 PORT 지정)
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: GEMINI_RPM
        value: "9"
      - key: GEMINI_RPD
        value: "200"
