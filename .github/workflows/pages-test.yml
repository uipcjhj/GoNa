# 테스트용 GitHub Pages 배포 — 작업 브랜치(claude/dino-snack-game)에 push 할 때마다 자동 배포
# main 브랜치용 배포(deploy.yml)와는 별개. 게임 코드는 그대로 빌드하고, 화면 위쪽에 '테스트 빌드 · 커밋' 표시만 붙음.
name: Test deploy (GitHub Pages)

on:
  push:
    branches: [claude/dino-snack-game]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build label
        id: label
        run: |
          SHORT=$(git rev-parse --short=7 HEAD)
          WHEN=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
          echo "text=🧪 테스트 빌드 · ${SHORT} · ${WHEN}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          VITE_BUILD_LABEL: ${{ steps.label.outputs.text }}
      - name: Version file
        run: |
          printf '{"branch":"%s","commit":"%s","short":"%s","built":"%s"}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ steps.label.outputs.short }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
